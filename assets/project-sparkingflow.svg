<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p2-t">
  <title id="p2-t">SparkingFlow: Data Lake &amp; ETL Orchestration. Airflow, PySpark, Docker, MinIO.</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="p2-glow" cx="18%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="p2-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p2-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p2-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p2-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p2-in { animation: p2-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p2-d1 { animation-delay: .15s; } .p2-d2 { animation-delay: .4s; }
    .p2-chip { animation: p2-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p2-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p2-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p2-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p2-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p2-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-in, .p2-chip { animation: none; } .p2-draw { animation: none; stroke-dashoffset: 0; } }
    .p2-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p2-trace 7s linear infinite; }
    @keyframes p2-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-trace { display: none; } }
  </style>
  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="370" fill="url(#p2-bg)"/>
    <rect width="480" height="370" fill="url(#p2-grid)"/>
    <rect width="1200" height="370" fill="url(#p2-glow)"/>
    <g class="p2-in p2-d1">
      <text class="p2-mono" x="516" y="62" text-anchor="end" font-size="12" letter-spacing="2.6" fill="#C77B9B">02 · DATA LAKE · AIRFLOW · DOCKER · 2025</text>
      <text class="p2-serif" x="518" y="126" text-anchor="end" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">SparkingFlow</text>
      <text class="p2-sans" x="516" y="166" text-anchor="end" font-size="17" fill="#B6A3AC">Data Lake &amp; ETL Orchestration with incremental UPSERT/SCD merges.</text>
      <text class="p2-mono" x="516" y="200" text-anchor="end" font-size="12.5" fill="#E5B5C7">Layered Parquet data lake, Airflow workflows, and centralized monitoring <tspan fill="#C77B9B">‹ BUILT</tspan></text>
      <line class="p2-draw" x1="100" y1="226" x2="516" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>
      <g transform="translate(56 266)">
        <text class="p2-serif" font-size="34" font-weight="300" fill="#F8F0F3">MinIO</text>
        <text class="p2-sans" y="24" font-size="12.5" fill="#B6A3AC">Object storage data lake</text>
      </g>
      <g transform="translate(230 266)">
        <text class="p2-serif" font-size="34" font-weight="300" fill="#F8F0F3">Airflow</text>
        <text class="p2-sans" y="24" font-size="12.5" fill="#B6A3AC">DAG orchestration</text>
      </g>
      <g transform="translate(410 266)">
        <text class="p2-serif" font-size="34" font-weight="300" fill="#F8F0F3">UPSERT</text>
        <text class="p2-sans" y="24" font-size="12.5" fill="#B6A3AC">Primary-key merges</text>
      </g>
      <g class="p2-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="110" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="111" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Apache Airflow</text></g>
      <g class="p2-chip" style="animation-delay:1.12s"><rect x="176" y="314" width="70" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="211" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">PySpark</text></g>
      <g class="p2-chip" style="animation-delay:1.24s"><rect x="256" y="314" width="60" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="286" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Docker</text></g>
      <g class="p2-chip" style="animation-delay:1.36s"><rect x="326" y="314" width="90" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="p2-mono" x="371" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Elasticsearch</text></g>
    </g>
    <g class="p2-in p2-d2"><g transform="translate(680 46)">
      <!-- Orchestration visual -->
      <rect x="0" y="0" width="460" height="280" rx="12" fill="#190B12" fill-opacity=".6" stroke="#C77B9B" stroke-opacity=".2"/>
      <g transform="translate(40 60)">
        <circle cx="0" cy="0" r="20" fill="#27101C" stroke="#C77B9B" stroke-opacity=".5"/>
        <text class="p2-mono" y="40" text-anchor="middle" font-size="10" fill="#B6A3AC">Load</text>
        <path d="M25 0 H100" stroke="#C77B9B" stroke-opacity=".3" marker-end="url(#arrow)"/>
      </g>
      <g transform="translate(160 60)">
        <circle cx="0" cy="0" r="20" fill="#2F1422" stroke="#C77B9B" stroke-opacity=".8"/>
        <text class="p2-mono" y="40" text-anchor="middle" font-size="10" fill="#F8F0F3">Transform</text>
        <path d="M25 0 H100" stroke="#C77B9B" stroke-opacity=".3"/>
      </g>
      <g transform="translate(280 60)">
        <circle cx="0" cy="0" r="20" fill="#27101C" stroke="#C77B9B" stroke-opacity=".5"/>
        <text class="p2-mono" y="40" text-anchor="middle" font-size="10" fill="#B6A3AC">Merge</text>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect class="p2-trace" style="animation-delay:3.5s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p2-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>