  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17120E"/><stop offset="1" stop-color="#100C09"/></linearGradient>
    <radialGradient id="ce-glow" cx="15%" cy="100%" r="70%"><stop offset="0" stop-color="#C8792C" stop-opacity=".5"/><stop offset="1" stop-color="#302317" stop-opacity="0"/></radialGradient>
    <linearGradient id="ce-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF2D6"/><stop offset=".5" stop-color="#F4D9A0"/><stop offset="1" stop-color="#8C7255" stop-opacity="0"/></linearGradient>
