<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p1-t">
  <title id="p1-t">ETL Data Warehouse Pipeline: PySpark ETL integrating MySQL, MongoDB, SFTP, and AWS S3.</title>
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17120E"/><stop offset="1" stop-color="#100C09"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#A96024" stop-opacity=".7"/><stop offset="1" stop-color="#302317" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p1-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C8792C" stroke-opacity=".07"/>
    </pattern>
    <filter id="p1-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p1-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p1-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF2D6"/><stop offset=".45" stop-color="#DDBB78"/><stop offset="1" stop-color="#C8792C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p1-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p1-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p1-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p1-in { animation: p1-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p1-d1 { animation-delay: .15s; } .p1-d2 { animation-delay: .4s; }
    .p1-chip { animation: p1-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p1-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p1-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p1-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p1-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p1-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-in, .p1-chip { animation: none; } .p1-draw { animation: none; stroke-dashoffset: 0; } }
    .p1-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p1-trace 7s linear infinite; }
    @keyframes p1-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-trace { display: none; } }
  </style>
  <g clip-path="url(#p1-clip)">
    <rect width="1200" height="370" fill="url(#p1-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p1-grid)"/>
    <rect width="1200" height="370" fill="url(#p1-glow)"/>
    <g class="p1-in p1-d1">
      <text class="p1-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C8792C">01 · DATA · PYSPARK · AWS · 2025</text>
      <text class="p1-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#FFF2D6">ETL Warehouse Pipeline</text>
      <text class="p1-sans" x="56" y="166" font-size="17" fill="#B9AA96">End-to-end PySpark ETL integrating MySQL, MongoDB, SFTP, and AWS S3.</text>
      <text class="p1-mono" x="56" y="200" font-size="12.5" fill="#DDBB78"><tspan fill="#C8792C">BUILT ›</tspan> Automated EMR cluster lifecycle + Redshift dimensional modeling</text>
      <line class="p1-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C8792C" stroke-opacity=".3"/>
    <g transform="translate(56 266)"><text class="p1-serif" font-size="34" font-weight="300" fill="#FFF2D6">4</text><text class="p1-sans" y="24" font-size="12.5" fill="#B9AA96">heterogeneous sources</text></g>
    <g transform="translate(261 266)"><text class="p1-serif" font-size="34" font-weight="300" fill="#FFF2D6">99.9%</text><text class="p1-sans" y="24" font-size="12.5" fill="#B9AA96">cluster automation</text></g>
    <g transform="translate(466 266)"><text class="p1-serif" font-size="34" font-weight="300" fill="#FFF2D6">Redshift</text><text class="p1-sans" y="24" font-size="12.5" fill="#B9AA96">data warehouse</text></g>
      <g class="p1-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="72" height="26" rx="13" fill="#211911" stroke="#C8792C" stroke-opacity=".35"/><text class="p1-mono" x="92" y="331" text-anchor="middle" font-size="11.5" fill="#DDBB78">PySpark</text></g><g class="p1-chip" style="animation-delay:1.12s"><rect x="136" y="314" width="60" height="26" rx="13" fill="#211911" stroke="#C8792C" stroke-opacity=".35"/><text class="p1-mono" x="166" y="331" text-anchor="middle" font-size="11.5" fill="#DDBB78">AWS S3</text></g><g class="p1-chip" style="animation-delay:1.24s"><rect x="204" y="314" width="70" height="26" rx="13" fill="#211911" stroke="#C8792C" stroke-opacity=".35"/><text class="p1-mono" x="239" y="331" text-anchor="middle" font-size="11.5" fill="#DDBB78">Redshift</text></g><g class="p1-chip" style="animation-delay:1.36s"><rect x="282" y="314" width="60" height="26" rx="13" fill="#211911" stroke="#C8792C" stroke-opacity=".35"/><text class="p1-mono" x="312" y="331" text-anchor="middle" font-size="11.5" fill="#DDBB78">Lambda</text></g><g class="p1-chip" style="animation-delay:1.48s"><rect x="350" y="314" width="130" height="26" rx="13" fill="#211911" stroke="#C8792C" stroke-opacity=".35"/><text class="p1-mono" x="415" y="331" text-anchor="middle" font-size="11.5" fill="#DDBB78">EMR Automation</text></g>
    </g>
    <g class="p1-in p1-d2"><g transform="translate(0 35)">
      <g transform="translate(870 46)">
        <!-- Data sources visual -->
        <rect x="-40" y="22" width="120" height="150" rx="6" fill="#211911" stroke="#C8792C" stroke-opacity=".2" transform="rotate(-9 20 75)"/>
        <rect x="-10" y="14" width="120" height="150" rx="6" fill="#302317" stroke="#C8792C" stroke-opacity=".28" transform="rotate(-3 50 75)"/>
        <g transform="rotate(4 100 75)">
          <rect x="20" y="8" width="140" height="180" rx="8" fill="#302317" stroke="#C8792C" stroke-opacity=".45"/>
          <text class="p1-mono" x="90" y="40" text-anchor="middle" font-size="12" fill="#FFF2D6">SOURCES</text>
          <text class="p1-mono" x="90" y="70" text-anchor="middle" font-size="10" fill="#B9AA96">MySQL</text>
          <text class="p1-mono" x="90" y="90" text-anchor="middle" font-size="10" fill="#B9AA96">MongoDB</text>
          <text class="p1-mono" x="90" y="110" text-anchor="middle" font-size="10" fill="#B9AA96">SFTP</text>
          <text class="p1-mono" x="90" y="130" text-anchor="middle" font-size="10" fill="#B9AA96">S3</text>
        </g>
        <g transform="translate(100 200)">
          <rect width="220" height="40" rx="8" fill="#17120E" fill-opacity=".92" stroke="#C8792C" stroke-opacity=".35"/>
          <text class="p1-mono" x="110" y="25" text-anchor="middle" font-size="11" fill="#FFF2D6">EMR → SPARK → REDSHIFT</text>
        </g>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C8792C" stroke-opacity=".2"/>
    <rect class="p1-trace" style="animation-delay:0.0s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p1-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
