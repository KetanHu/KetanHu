<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="tc-title tc-desc">
  <title id="tc-title">Tech stack</title>
  <desc id="tc-desc">Languages: Python (primary), SQL. Data Processing: PySpark, Apache Spark, Pandas, NumPy. Orchestration: Apache Airflow. Cloud &amp; Platforms: AWS (S3, EMR, Redshift, RDS, IAM), Databricks. Databases: PostgreSQL, MySQL, MongoDB. Tools: Docker, Git, GitHub.</desc>
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8792C"/><stop offset="1" stop-color="#302317"/>
    </linearGradient>
    <radialGradient id="tc-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#F4D9A0" stop-opacity=".9"/><stop offset="1" stop-color="#302317" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tc-pulse">
      <stop offset="0" stop-color="#FFF2D6"/><stop offset=".5" stop-color="#DDBB78" stop-opacity=".6"/><stop offset="1" stop-color="#C8792C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tc-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF2D6"/><stop offset=".45" stop-color="#DDBB78"/><stop offset="1" stop-color="#C8792C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .tc-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tc-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tc-panel { animation: tc-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tc-p1 { animation-delay: .05s; } .tc-p2 { animation-delay: .2s; } .tc-p3 { animation-delay: .35s; }
    .tc-p4 { animation-delay: .5s; } .tc-p5 { animation-delay: .65s; } .tc-p6 { animation-delay: .8s; }
    .tc-web { stroke-dasharray: 1800; stroke-dashoffset: 1800; animation: tc-draw 3s cubic-bezier(.65,0,.35,1) 1s forwards; }
    @keyframes tc-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes tc-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .tc-panel { animation: none; }
      .tc-web { animation: none; stroke-dashoffset: 0; }
    }
    .tc-trace { stroke-dasharray: 201 1120; stroke-dashoffset: 1321; animation: tc-trace 7s linear infinite; }
    @keyframes tc-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .tc-trace { display: none; } }
  </style>

  <rect width="1200" height="500" rx="20" fill="url(#tc-bg)"/>
  <rect width="1200" height="500" rx="20" fill="url(#tc-glow)"/>
  <rect x=".5" y=".5" width="1199" height="499" rx="19.5" fill="none" stroke="#C8792C" stroke-opacity=".16"/>

  <!-- Constellation -->
  <path class="tc-web" d="M24 250 H1176 M406 24 V476 M794 24 V476" fill="none" stroke="#FFF2D6" stroke-opacity=".22"/>

  <!-- Row 1 -->
  <g class="tc-panel tc-p1"><g transform="translate(32 32)">
    <rect width="360" height="200" rx="14" fill="#211911" fill-opacity=".85" stroke="#C8792C" stroke-opacity=".22"/>
    <rect class="tc-trace" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#C8792C">01  LANGUAGES</text>
    <text class="tc-serif" x="24" y="96" font-size="40" font-weight="300" fill="#F4D9A0">Python <tspan font-size="13" class="tc-mono" fill="#FFF2D6" dy="-18">PRIMARY</tspan></text>
    <text class="tc-serif" x="24" y="156" font-size="40" font-weight="300" fill="#F4D9A0">SQL</text>
  </g></g>
  <g class="tc-panel tc-p2"><g transform="translate(420 32)">
    <rect width="360" height="200" rx="14" fill="#211911" fill-opacity=".85" stroke="#C8792C" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-1.15s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#C8792C">02  DATA PROCESSING</text>
    <text class="tc-serif" x="24" y="90" font-size="34" font-weight="300" fill="#F4D9A0">PySpark  ·  Spark</text>
    <text class="tc-serif" x="24" y="140" font-size="28" font-weight="300" fill="#DDBB78">Pandas  ·  NumPy</text>
    <text class="tc-mono" x="24" y="176" font-size="10" letter-spacing="1.4" fill="#DDBB78">DISTRIBUTED COMPUTING</text>
  </g></g>
  <g class="tc-panel tc-p3"><g transform="translate(808 32)">
    <rect width="360" height="200" rx="14" fill="#211911" fill-opacity=".85" stroke="#C8792C" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-2.30s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#C8792C">03  ORCHESTRATION</text>
    <text class="tc-serif" x="24" y="96" font-size="36" font-weight="300" fill="#F4D9A0">Apache Airflow</text>
    <text class="tc-serif" x="24" y="150" font-size="22" font-weight="300" fill="#DDBB78">DAG workflows</text>
    <text class="tc-mono" x="24" y="176" font-size="10" letter-spacing="1.4" fill="#DDBB78">SCHEDULING &amp; MONITORING</text>
  </g></g>

  <!-- Row 2 -->
  <g class="tc-panel tc-p4"><g transform="translate(32 268)">
    <rect width="360" height="200" rx="14" fill="#211911" fill-opacity=".85" stroke="#C8792C" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-3.45s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#C8792C">04  CLOUD &amp; PLATFORMS</text>
    <text class="tc-serif" x="24" y="90" font-size="34" font-weight="300" fill="#F4D9A0">AWS  ·  Databricks</text>
    <text class="tc-serif" x="24" y="132" font-size="22" font-weight="300" fill="#DDBB78">S3 · EMR · Redshift · Lambda</text>
    <text class="tc-mono" x="24" y="170" font-size="10" letter-spacing="1.4" fill="#DDBB78">AWS CERTIFIED CLOUD PRACTITIONER</text>
  </g></g>
  <g class="tc-panel tc-p5"><g transform="translate(420 268)">
    <rect width="360" height="200" rx="14" fill="#211911" fill-opacity=".85" stroke="#C8792C" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-4.60s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#C8792C">05  DATABASES</text>
    <text class="tc-serif" x="24" y="90" font-size="32" font-weight="300" fill="#F4D9A0">PostgreSQL  ·  MySQL</text>
    <text class="tc-serif" x="24" y="140" font-size="28" font-weight="300" fill="#F4D9A0">MongoDB</text>
    <text class="tc-mono" x="24" y="176" font-size="10" letter-spacing="1.4" fill="#DDBB78">NORMALIZATION · PERFORMANCE TUNING</text>
  </g></g>
  <g class="tc-panel tc-p6"><g transform="translate(808 268)">
    <rect width="360" height="200" rx="14" fill="#211911" fill-opacity=".85" stroke="#C8792C" stroke-opacity=".22"/>
    <rect class="tc-trace" style="animation-delay:-5.75s" width="360" height="200" rx="14" fill="none" stroke="url(#tc-trace)" stroke-width="1.4" stroke-linecap="round"/>
    <text class="tc-mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#C8792C">06  TOOLS &amp; DEVOPS</text>
    <text class="tc-serif" x="24" y="96" font-size="40" font-weight="300" fill="#F4D9A0">Docker  ·  Git</text>
    <text class="tc-serif" x="24" y="150" font-size="26" font-weight="300" fill="#DDBB78">GitHub · Tableau</text>
  </g></g>
</svg>