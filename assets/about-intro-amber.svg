<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="ab-t ab-d">
  <title id="ab-t">About Ketan Hadkar</title>
  <desc id="ab-d">Ketan Hadkar, Data Engineer. B.Tech in Electronics and Telecommunication. Currently working on ETL pipelines, incremental data processing, database automation and data warehousing. Interests in distributed processing, cloud data engineering, data architecture and workflow orchestration. Motto: Building reliable data solutions, one pipeline at a time. Primary language Python.</desc>
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17120E"/><stop offset="1" stop-color="#100C09"/></linearGradient>
    <radialGradient id="ab-glow" cx="80%" cy="20%" r="70%"><stop offset="0" stop-color="#A96024" stop-opacity=".6"/><stop offset="1" stop-color="#302317" stop-opacity="0"/></radialGradient>
    <pattern id="ab-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#FFF2D6" opacity=".025"/></pattern>
  </defs>
  <style>
    .ab-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ab-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ab-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ab-card { animation: ab-in 1s cubic-bezier(.16,1,.3,1) both; }
    .ab-fade { animation: ab-fade .6s ease both; }
    @keyframes ab-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    @keyframes ab-fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ab-card, .ab-fade { animation: none; } }
  </style>
  <rect width="1200" height="520" rx="20" fill="url(#ab-bg)"/>
  <rect width="1200" height="520" rx="20" fill="url(#ab-glow)"/>
  <rect x=".5" y=".5" width="1199" height="519" rx="19.5" fill="none" stroke="#C8792C" stroke-opacity=".16"/>

